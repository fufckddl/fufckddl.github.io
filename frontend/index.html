<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta
      name="description"
      content="문제를 끝까지 구현하는 프론트엔드 개발자 이창렬의 포트폴리오입니다."
    >
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%23f3efe4'/%3E%3Cpath d='M16 14h12v8h-4v20h4v8H16V14Zm19 0h10v28h9v8H35V14Z' fill='%23151512'/%3E%3Cpath d='M8 56h48v4H8v-4Z' fill='%2327c783'/%3E%3C/svg%3E"
    >
    <script>
      (() => {
        let theme = "light";

        try {
          const key = "changryul-portfolio-theme";
          const stored = localStorage.getItem(key);

          theme =
            stored === "dark" || stored === "light"
              ? stored
              : matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light";
        } catch {
          theme = "light";
        }

        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
      })();
    </script>
    <title>이창렬 포트폴리오</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
